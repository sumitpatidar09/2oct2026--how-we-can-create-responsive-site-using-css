<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RMD Grid View</title>
        <style>
            body{margin: 0px;}
            .tbdr{
                background-color: aqua;
            }
            .row{
                clear: both;
            }
            .col-1{width: 8.33%;
                   float: left;            
            }
            .col-2{width:16.66%;
                   float: left;            
            }
            .col-3{width: 25%;
                   float: left;            
            }
            .col-4{width: 33.33%;
                   float: left;            
            }
            .col-5{width: 41.66%;
                   float: left;            
            }
            .col-6{width: 50%;
                   float: left;            
            }
            .col-7{width: 58.33%;
                   float: left;            
            }
            .col-8{width:66.66%;
                   float: left;            
            }
            .col-9{width: 75%;
                   float: left;            
            }
            .col-10{width: 83.33%;
                   float: left;            
            }
            .col-11{width: 91.66%;
                   float: left;            
            }
            .col-12{width: 100%;
                   float: left;            
            }
            .h-100{height: 100%;}
            header{
                background-color: #9933CC;
                height: 108px;
            }
            main{
                background-color: #fff;
                height: 335px;
            }
            footer{
                background-color: #0099CC;
                height: 68px;
            }
            main ul{
                list-style:none;
            }
        
            main ul li button{
                width: 100%;
                background-color: #0099CC;
                border: none;
                padding: 10px;
                margin-bottom:10px ;
            }

            @media only screen and (max-width: 599px) {
                .col-3,.col-6{width: 100%;
                float: left;} 
                
             }
            @media only screen and (min-width:600px) and  (max-width:767px) {
                .col-6{width:80%;
                      float: left;          
                } 
                .col-3{width:20%;} 

                 main > div > aside:last-child{
                width: 100%;
             }
             }
            
        </style>
    </head>
    <body>
        <div>
            <header class="col-12"></header>
            <main class="col-12">
                <div class="row h-100">
                    <aside class="col-3 h-100" style="background-color: red;">
                        <ul>
                            <li>
                                <button>A</button>
                            </li>
                            <li>
                                <button>B</button>
                            </li>
                            <li>
                                <button>C</button>
                            </li>
                            <li>
                                <button>D</button>
                            </li>
                        </ul>
                    </aside>
                    <section class="col-6 h-100" style="background-color: aqua;">section</section>
                    <aside class="col-3 h-100" style="background-color: green;">aside right</aside>
                </div>
            </main>
            <footer class="col-12">footer</footer>
        </div>
        
       
    </body>
</html>
